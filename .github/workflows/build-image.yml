name: Build and Deploy Docker Image

env:
  SERVICE_NAME: agentsmcp-service
  DOCKER_IMAGE: mdh266/agentsmcp
  REGION: us-central1
  TAG: cloud

on:
  push:
    branches:
      - "main"
    paths:
    - mymcp/Dockerfile
    - mymcp/*.py
    - .github/workflows/build-image.yaml

  workflow_dispatch: {}

    
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3
    
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker
        run: | 
          docker build -f mymcp/Dockerfile\
                       -t ${{ env.DOCKER_IMAGE }}:${{ env.TAG }}  .
          docker push ${{ env.DOCKER_IMAGE }}:${{ env.TAG }}

      - name: Google Cloud Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
    
      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'
    
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.DOCKER_IMAGE }}:${{ env.TAG }} \
            --region=${{ env.REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --set-env-vars=OPEN_WEATHER_MAP_API_KEY=${{ secrets.OPEN_WEATHER_MAP_API_KEY }},GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }},REDIS_USERNAME=${{ secrets.REDIS_USERNAME }},REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }},REDIS_URL=${{ secrets.REDIS_URL }},MONGO_USERNAME=${{ secrets.MONGO_USERNAME }},MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }},MONGO_URL=${{ secrets.MONGO_URL }}