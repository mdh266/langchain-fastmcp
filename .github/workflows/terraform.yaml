name: Terraform CI


on: 
    push:
        branches:
        - main
        paths:
        - 'terraform/**'

jobs:
    terraform:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./terraform
        env:
            OPEN_WEATHER_MAP_API_KEY: ${{ secrets.OPEN_WEATHER_MAP_API_KEY }}
            GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}s

            TF_VAR_project_id:   ${{ secrets.GCP_PROJECT_ID }}   # <-- added (secret)
            TF_VAR_region:       "us-central1"                   # <-- added (static default)
            TF_VAR_service_name: "weather-server"                # <-- added (static default)
            TF_VAR_container_image: "gcr.io/my-gcp-project/weather:latest"   # <-- added        

        steps:
        - name: Checkout repository
          uses: actions/checkout@v3
          

        - name: Cache Terraform plugins & modules
          uses: actions/cache@v4
          with:
            path: |
              .terraform
              .terraform.lock.hcl
            key: ${{ runner.os }}-terraform-${{ hashFiles('terraform/**/*.tf') }}
            restore-keys: |
               ${{ runner.os }}-terraform-


        - name: Set up Terraform
          uses: hashicorp/setup-terraform@v2
          with:
            terraform_version: 1.15.3
    
        - name: Terraform Init
          run: terraform init -input=false
    
        - name: Terraform Validate
          run: terraform validate -no-color

        - name: Terraform plan
          run: terraform plan -input=false -no-color -out=tfplan
        
        - name: Upload Terraform plan artifact
          uses: actions/upload-artifact@v4
          with:
            name: tfplan
            path: terraform/tfplan

    apply:
        needs: terraform
        runs-on: ubuntu-latest
        # if github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        defaults:
            run:
                working-directory: ./terraform
        env:
            OPEN_WEATHER_MAP_API_KEY: ${{ secrets.OPEN_WEATHER_MAP_API_KEY }}
            GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

            TF_VAR_project_id: ${{ secrets.GOOGLE_PROJECT_ID }}
            TF_VAR_region:       "us-central1"
            TF_VAR_service_name: "weather-server"
            TF_VAR_container_image: "gcr.io/my-gcp-project/weather:latest"            
        steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Terraform
          uses: hashicorp/setup-terraform@v3
          with:
            terraform_version: 1.15.3
        
        - name: Download Terraform plan artifact
          uses: actions/download-artifact@v4
          with:
            name: tfplan
            path: .

        - name: Terraform Apply
          run: terraform apply -input=false -no-color -auto-approve tfplan